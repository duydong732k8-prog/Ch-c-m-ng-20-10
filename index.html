<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10</title>
    <!-- Nhúng phông chữ nghệ thuật Dancing Script và Playfair Display từ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Nền sáng pastel hồng kem ngọt ngào, sang trọng */
            background: linear-gradient(135deg, #fff0f3, #ffe5ec, #fff1f8);
            overflow: hidden;
            font-family: 'Dancing Script', 'Playfair Display', cursive, serif;
            height: 100vh;
            color: #4a2832;
        }

        /* Hiệu ứng hạt lấp lánh & vì sao sáng trên nền sáng */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #ffb7c5;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff69b4, 0 0 15px #fff;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Khu vực chứa các lớp chữ chạy */
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            z-index: 2;
            display: flex;
            justify-content: space-around;
        }

        /* Mỗi lớp chữ (8 cột cân đối) */
        .text-layer {
            position: relative;
            width: 11.5%;
            height: 100%;
            overflow: hidden;
        }

        .scrolling-content {
            position: absolute;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 35px;
            animation: scrollDown var(--speed) linear infinite;
            animation-delay: var(--delay);
        }

        .wished-item {
            padding: 14px 10px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(255, 105, 180, 0.4);
            border-radius: 14px;
            font-size: 16px; /* Tăng kích thước phông nghệ thuật cho dễ đọc */
            font-weight: 700;
            line-height: 1.4;
            text-align: center;
            color: #8b1e4b;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.45);
            backdrop-filter: blur(4px);
        }

        @keyframes scrollDown {
            0% {
                transform: translateY(-100%);
            }
            100% {
                transform: translateY(100vh);
            }
        }

        /* Tiêu đề trung tâm nổi bật */
        .center-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 55px;
            border-radius: 25px;
            border: 2px solid #ff69b4;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.35);
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
